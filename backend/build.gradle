plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stecker'
// The release version. The image build passes it from git
// (-PappVersion=<git describe>); otherwise a development version.
version = findProperty('appVersion') ?: '0.0.1-SNAPSHOT'

springBoot {
	// Writes META-INF/build-info.properties (version, build time), which
	// /actuator/info shows: which version is running in which copy. The
	// build time only for image builds: otherwise it changes every build and
	// Gradle would rerun all tests each time.
	buildInfo {
		if (!findProperty('appVersion')) {
			excludes = ['time']
		}
	}
}

tasks.named('bootJar') {
	// A fixed name, whatever the version is called (the Dockerfile copies it).
	archiveFileName = 'backend.jar'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// Health checks for Kubernetes (liveness/readiness probes).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Staff sign-in sessions in PostgreSQL, so every backend copy knows them.
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
