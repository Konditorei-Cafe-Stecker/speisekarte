spring.datasource.url=jdbc:postgresql://localhost:5432/stecker
spring.datasource.username=stecker_app
spring.datasource.password=${STECKER_DB_PASSWORD}

# Running locally without real guests: add yesterday's synthetic orders
# and publish a new forecast every day (python3 -m venv analysis/.venv;
# analysis/.venv/bin/pip install -r analysis/requirements.txt).
stecker.synthetic.daily-orders.enabled=true
stecker.forecast.publish.python=../analysis/.venv/bin/python

# Local development has no proxy in front: never trust X-Forwarded-For
# (any machine on the network could otherwise pick the address the login
# limit counts). Kubernetes uses the default from application.properties.
server.forward-headers-strategy=none
