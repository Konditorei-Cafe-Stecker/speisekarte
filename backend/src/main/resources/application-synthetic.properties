# Profile for generating the synthetic order history. Use together with
# the local profile:
#   ./gradlew bootRun --args='--spring.profiles.active=local,synthetic'
# The app imports the context data, writes the orders and then stops.
# (The web server still starts, because the security setup needs it, but
# only on a random port that is reachable from this computer alone.)
server.port=0
server.address=127.0.0.1
stecker.synthetic.generate=true
