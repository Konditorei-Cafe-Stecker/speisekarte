spring.application.name=backend

# The database structure is managed by Flyway migrations in
# src/main/resources/db/migration. Hibernate only checks that the entities
# match it and never changes tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Databases created before migrations were introduced already contain the
# version 1 tables. Flyway records them as version 1 instead of creating them.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Errors are answered as RFC 9457 problem details with a German "detail"
# text, and never with a stack trace (also not with devtools active).
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Staff sign-in: the session lasts a working day, the cookie is not sent
# along when another site links here with a form post.
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Sessions live in PostgreSQL (tables from migration V5), so any number of
# backend copies share them. Flyway creates the tables, Spring never does.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=12h

# Running behind a proxy (the frontend's nginx, Kubernetes): trust its
# X-Forwarded-* headers so the login limit sees the guest's address and
# not the proxy's. Tomcat only trusts proxies on private networks, and
# nginx replaces (never appends to) X-Forwarded-For, so a guest cannot
# choose the address the limit counts.
server.forward-headers-strategy=native

# Health checks for Kubernetes: /actuator/health/liveness and /readiness,
# and /actuator/info with the running version (build-info from Gradle).
# Nothing else from Actuator is exposed; nginx forwards none of it.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Finish running requests before stopping (rolling updates, scaling down).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# The first admin account, created once while no account exists. Set these
# as environment variables, never in this file:
# STECKER_BOOTSTRAP_ADMIN_USERNAME, STECKER_BOOTSTRAP_ADMIN_PASSWORD,
# optionally STECKER_BOOTSTRAP_ADMIN_DISPLAY_NAME.
stecker.bootstrap-admin.username=${STECKER_BOOTSTRAP_ADMIN_USERNAME:}
stecker.bootstrap-admin.password=${STECKER_BOOTSTRAP_ADMIN_PASSWORD:}
stecker.bootstrap-admin.display-name=${STECKER_BOOTSTRAP_ADMIN_DISPLAY_NAME:Admin}

# Staffing assumption for the owner's planning page (changeable there).
stecker.admin.staff.orders-per-staff-hour=6
stecker.admin.staff.min-staff=2

# Daily update of the real context data (DWD weather, Werder home matches):
# every morning and once after start. Needs internet; failures are logged.
stecker.context.daily-update.enabled=true
stecker.context.daily-update.cron=0 15 6 * * *

# Warm-up of the guest endpoints before the backend reports ready (see
# JitWarmup). Off by default; Kubernetes sets a number of rounds.
stecker.warmup.requests=0
