spring.application.name=backend

# The database structure is managed by Flyway migrations in
# src/main/resources/db/migration. Hibernate only checks that the entities
# match it and never changes tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Databases created before migrations were introduced already contain the
# version 1 tables. Flyway records them as version 1 instead of creating them.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Errors are answered as RFC 9457 problem details with a German "detail"
# text, and never with a stack trace (also not with devtools active).
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Staff sign-in: the session lasts a working day, the cookie is not sent
# along when another site links here with a form post.
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# The first admin account, created once while no account exists. Set these
# as environment variables, never in this file:
# STECKER_BOOTSTRAP_ADMIN_USERNAME, STECKER_BOOTSTRAP_ADMIN_PASSWORD,
# optionally STECKER_BOOTSTRAP_ADMIN_DISPLAY_NAME.
stecker.bootstrap-admin.username=${STECKER_BOOTSTRAP_ADMIN_USERNAME:}
stecker.bootstrap-admin.password=${STECKER_BOOTSTRAP_ADMIN_PASSWORD:}
stecker.bootstrap-admin.display-name=${STECKER_BOOTSTRAP_ADMIN_DISPLAY_NAME:Admin}
