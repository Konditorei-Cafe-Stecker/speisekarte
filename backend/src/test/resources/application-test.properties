# In-memory database for tests. The Flyway migrations create the tables, so
# the tests also check that the migrations and the entities match.
spring.datasource.url=jdbc:h2:mem:stecker_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
