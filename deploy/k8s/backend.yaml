# Spring Boot backend behind the "backend" service: 2 copies locally (more
# in a cloud cluster, see maxReplicas below), plus 1 more briefly during an
# update.
# Every copy is interchangeable: staff sessions are in PostgreSQL
# (migration V5), and the daily weather/match update runs as a CronJob
# (jobs.yaml) instead of inside each copy.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app: backend}
spec:
  selector: {app: backend}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The same copies once more, but "headless": DNS returns the address of
# every ready copy, so nginx can spread single requests over all of them
# (least busy first) instead of pinning whole connections to one copy.
apiVersion: v1
kind: Service
metadata:
  name: backend-pods
  labels: {app: backend}
spec:
  clusterIP: None
  selector: {app: backend}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app: backend}
spec:
  # No "replicas" here: the autoscaler below decides (locally fixed at 2;
  # raise maxReplicas in a cloud cluster). A fixed number here would reset
  # the autoscaled count on every deploy, even during a rush.
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      terminationGracePeriodSeconds: 40
      initContainers:
        # Start only once PostgreSQL accepts connections (no crash loop on
        # a fresh cluster while the database is still starting).
        - name: wait-for-database
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -q; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      containers:
        - name: backend
          image: stecker-backend
          args:
            - "--stecker.context.daily-update.enabled=false"
            # Send 500 rounds of guest requests to itself before reporting
            # ready, so guests never meet a cold JVM (JitWarmup). Enough for
            # the JIT to compile the hot code; more costs CPU in a rush.
            - "--stecker.warmup.requests=500"
            # With 2 CPUs per copy, more threads only wait and use memory
            # (200 threads pushed copies over the memory limit). Requests
            # beyond 50 queue in nginx and Tomcat instead.
            - "--server.tomcat.threads.max=50"
            # Health checks and version info (/actuator/info) on their own
            # port and threads, so a busy copy still answers Kubernetes. No
            # service exposes 8081 and the network policy admits no pod to it.
            - "--management.server.port=8081"
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/stecker"}
            - {name: SPRING_DATASOURCE_USERNAME, value: stecker_app}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: stecker-db, key: password}}
            # 4 copies x 10 connections stay well below PostgreSQL's 100.
            - {name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE, value: "10"}
            - name: STECKER_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: stecker-admin, key: username, optional: true}}
            - name: STECKER_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: stecker-admin, key: password, optional: true}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 5
            # A copy starting during a rush is slow to answer; with the
            # default 1 s it was killed half-started (measured) and began
            # again, wasting the CPU it had already spent.
            timeoutSeconds: 3
            failureThreshold: 36        # up to 3 minutes for a cold start
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6         # a busy minute is no reason to restart
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # Keep serving while the copy disappears from DNS and nginx
            # notices (nginx looks up the copies every 5 s), then Spring's
            # graceful shutdown finishes the running requests (20 s max;
            # terminationGracePeriodSeconds 40 covers both).
            preStop:
              sleep: {seconds: 15}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 768Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: backend}
  minReplicas: 2
  # Locally 2: the kind cluster is one node with 4 CPUs, and a further Java
  # copy cannot add CPU there. Measured with 10,000 guests: 2 copies pass,
  # while starting a 3rd at peak load (over 1 CPU for start and warm-up)
  # slowed everything down. A new copy only helps where it gets CPUs of
  # its own: in a cloud cluster raise this with the number of nodes.
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      # One new copy per minute: every start costs CPU (Java start and
      # warm-up) exactly when the copies are busy.
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
    scaleDown:
      stabilizationWindowSeconds: 300   # no flapping after a rush
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: backend}
