# Café Stecker on Kubernetes:  kubectl apply -k deploy/k8s
# The secrets "stecker-db" and "stecker-admin" are not in git; the script
# deploy/local-up.sh creates them (see deploy/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stecker
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - jobs.yaml
images:
  - {name: stecker-backend, newName: stecker-backend, newTag: dev}
  - {name: stecker-frontend, newName: stecker-frontend, newTag: dev}
  - {name: stecker-tools, newName: stecker-tools, newTag: dev}
